server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;

    root /var/www/html/public;
    index index.php;

    # 1. Static uploads / public storage (read-only)
    location /storage/ {
        alias /var/www/storage/app/public/;
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 2. Static assets (Vite build CSS, JS, Gambar, Font, Ikon)
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # 3. Semua request web/API diarahkan ke front-controller Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 4. Eksekusi script PHP melalui PHP-FPM di container "app"
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_read_timeout 60s;

        fastcgi_param QUERY_STRING       $query_string;
        fastcgi_param REQUEST_METHOD     $request_method;
        fastcgi_param CONTENT_TYPE       $content_type;
        fastcgi_param CONTENT_LENGTH     $content_length;

        fastcgi_param SCRIPT_FILENAME    $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME        $fastcgi_script_name;
        fastcgi_param REQUEST_URI        $request_uri;
        fastcgi_param DOCUMENT_URI       $document_uri;
        fastcgi_param DOCUMENT_ROOT      $document_root;

        fastcgi_param SERVER_PROTOCOL    $server_protocol;
        fastcgi_param REQUEST_SCHEME     $scheme;
        fastcgi_param HTTPS              $https if_not_empty;
        fastcgi_param GATEWAY_INTERFACE  CGI/1.1;
        fastcgi_param SERVER_SOFTWARE    nginx;

        fastcgi_param REMOTE_ADDR        $remote_addr;
        fastcgi_param REMOTE_PORT        $remote_port;
        fastcgi_param SERVER_ADDR        $server_addr;
        fastcgi_param SERVER_PORT        $server_port;
        fastcgi_param SERVER_NAME        $host;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
