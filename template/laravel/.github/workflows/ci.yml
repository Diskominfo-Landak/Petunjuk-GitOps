name: CI

on:
  push:
    branches: [development, main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tes dan audit paket
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql, fileinfo
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pasang dependensi PHP
        working-directory: src
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Build aset frontend (Vite)
        working-directory: src
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
            npm run build
          fi

      - name: Siapkan environment tes
        working-directory: src
        run: |
          cp .env.example .env 2>/dev/null || cp ../.env.docker.example .env
          php artisan key:generate

      - name: Jalankan unit/feature test
        working-directory: src
        run: php artisan test

      - name: Cek kerentanan paket
        working-directory: src
        run: composer audit --no-dev
        continue-on-error: true

  image:
    name: Build dan push image container
    runs-on: ubuntu-24.04
    needs: test
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/development' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Login ke GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tentukan metadata tag image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build dan push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
