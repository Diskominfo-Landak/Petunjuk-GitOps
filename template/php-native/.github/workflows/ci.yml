name: CI

on:
  push:
    branches: [development, main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  gatekeeper:
    name: Validasi Kebijakan Branch
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Cegah Direct Push ke Branch main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            if (prs.data.length === 0) {
              core.setFailed("❌ DILARANG PUSH LANGSUNG KE MAIN! Semua perubahan ke branch 'main' WAJIB melalui mekanisme Pull Request dari branch 'development'.");
            } else {
              console.log(`✅ Push ke main diizinkan karena berasal dari Pull Request #${prs.data[0].number}`);
            }

  lint:
    name: Sintaks dan linter PHP
    runs-on: ubuntu-24.04
    needs: gatekeeper
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, mysqli, pdo_mysql, gd, zip
          coverage: none

      - name: Periksa sintaks PHP
        run: |
          find src -type f -name "*.php" -exec php -l {} \;

  image:
    name: Build dan push image container
    runs-on: ubuntu-24.04
    needs: lint
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/development' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Login ke GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tentukan metadata tag image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build dan push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
